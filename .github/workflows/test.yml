name: Test formula

on:
  push:
    paths: ["Formula/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brew:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          [ -f Formula/trackified.rb ] || { echo "no formula yet"; exit 0; }
          brew tap-new --no-git local/trackified-test
          cp Formula/trackified.rb "$(brew --repository)/Library/Taps/local/homebrew-trackified-test/Formula/"
          brew install local/trackified-test/trackified
          brew test local/trackified-test/trackified
          trackified version
